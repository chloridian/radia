[render.draw_distance]
type = "f32"
default = 512.0
range = [32.0, 1024.0]
step = 8.0
unit = "meters"
persistent = true
apply = "live"
help = "Maximum distance in meters at which scene geometry and terrain are drawn."

[render.field_of_view_deg]
type = "f32"
default = 60.0
range = [30.0, 110.0]
step = 1.0
unit = "deg"
persistent = true
apply = "live"
help = "Vertical camera field of view in degrees."

[render.max_fps]
type = "i64"
default = 60
range = [15, 240]
unit = "fps"
persistent = true
apply = "live"
help = "Maximum viewport frame rate in frames per second."

[render.max_vram_budget_mib]
type = "i64"
default = 0
range = [1024, 65536]
unit = "MiB"
persistent = true
apply = "live"
help = "Maximum GPU VRAM budget in MiB before texture eviction (0 = auto)."

[render.texture_vram_divisor]
type = "i64"
default = 1
range = [1, 8]
persistent = true
apply = "live"
help = "Divisor applied to detected VRAM when computing the automatic GPU VRAM budget."

[render.max_texture_resolution]
type = "enum"
default = "2048"
values = ["512", "1024", "2048"]
persistent = true
apply = "live"
help = "Maximum texture edge resolution requested for scene textures."

[render.worker_threads]
type = "i64"
default = 0
range = [2, 64]
persistent = true
apply = "restart_required"
help = "Total background CPU worker threads shared by texture and mesh jobs (0 = auto)."

[render.show_stats]
type = "bool"
default = false
persistent = false
apply = "live"
help = "Display the live performance stats overlay on the viewport."
