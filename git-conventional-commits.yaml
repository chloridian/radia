---
convention:
  commitMessageRegexPattern: '^(?<type>\w+)(?:\((?<scope>[^()\r\n]+)\))?(?<breaking>!)?:[ \t]+(?<description>[^\r\n]+)\r?$'
  commitTypes:
    - feat # Commits that add or remove a new feature to/of/from the API or UI
    - fix # Commits that fix a bug of a preceded `feat` commit
    - refactor # Commits that rewrite/restructure your code, however do not change any behaviour
    - perf # Commits that are special `refactor` commits, that improve performance
    - style # Commits that do not affect the meaning (white-space, formatting, missing semi-colons, etc.)
    - test # Commits that add missing tests or correcting existing tests
    - build # Commits that affect build components like build tool, ci pipeline, dependencies, project version, etc.
    - ops # Commits that affect operational components like infrastructure, deployment, backup, recovery, etc.
    - docs # Commits that affect documentation only
    - chore # Miscellaneous commits e.g. modifying `.gitignore`
    - merge
    - revert
  commitScopes: []
  releaseTagGlobPattern: v[0-9]*.[0-9]*.[0-9]*
changelog:
  commitTypes:
    - feat
    - fix
    - perf
    - merge
  includeInvalidCommits: true
  commitIgnoreRegexPattern: "^WIP "
  headlines:
    feat: Features
    fix: Bug Fixes
    perf: Performance Improvements
    merge: Merges
    breakingChange: BREAKING CHANGES
  commitUrl: https://github.com/hymenaei/Radia/commit/%commit%
  commitRangeUrl: https://github.com/hymenaei/Radia/compare/%from%...%to%?diff=split
  issueRegexPattern: "#[0-9]+"
  issueUrl: https://github.com/hymenaei/Radia/issues/%issue%
