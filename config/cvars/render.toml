[render.draw_distance]
type = "f32"
default = 512.0
range = [32.0, 1024.0]
step = 8.0
unit = "meters"
persistent = true
apply = "live"
help = "Maximum distance in meters at which scene geometry and terrain are drawn."

[render.show_stats]
type = "bool"
default = false
persistent = false
apply = "live"
help = "Display the live performance stats overlay on the viewport."
