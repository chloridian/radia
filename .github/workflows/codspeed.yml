name: Bench

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    id-token: write

env:
    CARGO_TERM_COLOR: always

jobs:
    benches:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: core
                      packages: -p llsd -p network -p protocol -p storage -p assets
                    - name: inventory
                      packages: -p inventory
                    - name: world
                      packages: -p world
                    - name: render
                      packages: -p render
        steps:
            - uses: actions/checkout@v7
            - uses: actions-rust-lang/setup-rust-toolchain@v2

            - name: Install Linux system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                    build-essential \
                    cmake \
                    libfontconfig1-dev \
                    libvulkan-dev \
                    libwayland-dev \
                    libx11-xcb-dev \
                    libxkbcommon-x11-dev \
                    pkg-config

            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-codspeed

            - uses: extractions/setup-just@v4

            - run: just codspeed-build ${{ matrix.packages }}

            - uses: CodSpeedHQ/action@v5
              with:
                  mode: simulation
                  run: just codspeed-run ${{ matrix.packages }}
