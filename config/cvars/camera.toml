[camera.focus_duration_ms]
type = "i64"
default = 400
range = [0, 2000]
unit = "ms"
persistent = true
apply = "live"
help = "Duration in milliseconds for camera focus transitions."

[camera.follow_smoothing_half_life_s]
type = "f64"
default = 0.02
range = [0.001, 0.5]
step = 0.005
unit = "s"
persistent = true
apply = "live"
help = "Half-life in seconds for follow-camera position smoothing."

[camera.turn_rate_deg_per_sec]
type = "f32"
default = 90.0
range = [15.0, 360.0]
step = 5.0
unit = "deg/s"
persistent = true
apply = "live"
help = "Avatar keyboard turn rate in degrees per second."

[camera.invert_y]
type = "bool"
default = false
persistent = true
apply = "live"
help = "Invert vertical mouse camera pitch movement."

[camera.orbit_sensitivity]
type = "f64"
default = 1.0
range = [0.1, 5.0]
step = 0.1
persistent = true
apply = "live"
help = "Multiplier for mouse camera orbit and drag sensitivity."
