name: Security

on:
    schedule:
        - cron: "0 6 * * 1"
    pull_request:
        paths:
            - Cargo.lock
            - "**/Cargo.toml"
            - deny.toml
            - .github/workflows/security.yml
    push:
        branches: [main]
        paths:
            - Cargo.lock
            - "**/Cargo.toml"
            - deny.toml
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    deny:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: extractions/setup-just@v2
            - uses: taiki-e/install-action@cargo-deny
            - run: just security
