[render.draw_distance]
type = "f32"
default = 512.0
range = [32.0, 1024.0]
step = 8.0
unit = "meters"
persistent = true
apply = "live"
help = "Maximum distance in meters at which scene geometry and terrain are drawn."

[render.field_of_view_deg]
type = "f32"
default = 60.0
range = [30.0, 110.0]
step = 1.0
unit = "deg"
persistent = true
apply = "live"
help = "Vertical camera field of view in degrees."

[render.max_fps]
type = "i64"
default = 60
range = [15, 240]
unit = "fps"
persistent = true
apply = "live"
help = "Maximum viewport frame rate in frames per second."

[render.texture_soft_cap_mib]
type = "i64"
default = 0
range = [128, 4096]
auto = true
unit = "MiB"
persistent = true
apply = "live"
help = "Target memory cap in MiB for decoded textures before background eviction (0 = auto)."

[render.mesh_memory_mib]
type = "i64"
default = 0
range = [16, 1024]
auto = true
unit = "MiB"
persistent = true
apply = "restart_required"
help = "GPU memory budget in MiB for resident scene meshes (0 = auto)."

[render.texture_staging_mib]
type = "i64"
default = 0
range = [16, 1024]
auto = true
unit = "MiB"
persistent = true
apply = "restart_required"
help = "CPU staging memory budget in MiB for texture uploads (0 = auto)."

[render.texture_jobs]
type = "i64"
default = 0
range = [1, 64]
auto = true
persistent = true
apply = "restart_required"
help = "Maximum background texture decode jobs (0 = auto)."

[render.mesh_jobs]
type = "i64"
default = 0
range = [1, 64]
auto = true
persistent = true
apply = "restart_required"
help = "Maximum background mesh preparation jobs (0 = auto)."

[render.show_stats]
type = "bool"
default = false
persistent = false
apply = "live"
help = "Display the live performance stats overlay on the viewport."
