[scene.lod_factor]
type = "f32"
default = 1.0
range = [0.25, 4.0]
step = 0.05
persistent = true
apply = "live"
help = "Distance multiplier for mesh and prim level-of-detail switching."

[scene.memory_budget_mib]
type = "i64"
default = 0
range = [64, 4096]
auto = true
unit = "MiB"
persistent = true
apply = "restart_required"
help = "CPU memory budget in MiB for derived scene geometry (0 = auto)."
