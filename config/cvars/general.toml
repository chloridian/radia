[log.level]
type = "enum"
default = "info"
values = ["error", "warn", "info", "debug", "trace"]
persistent = true
apply = "live"
help = "Minimum log level to output."

[log.noisy_network]
type = "bool"
default = false
persistent = true
apply = "live"
help = "Include verbose network subsystem logs."

[chat.max_history_messages]
type = "i64"
default = 500
range = [50, 5000]
persistent = true
apply = "live"
help = "Maximum number of nearby chat messages retained in history."

[general.max_ram_budget_mib]
type = "i64"
default = 0
range = [256, 65536]
unit = "MiB"
persistent = true
apply = "restart_required"
help = "Optional cap in MiB on CPU memory for asset decoding and the scene geometry cache (0 = no cap; the viewer backs off when the system runs low on memory)."
